name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests (guardrails, decision logic, MCP end-to-end)
        run: pytest -q
      - name: Example config is valid and policy only tightens
        run: python -c "from homestead.config import load_config; from homestead.server import build_app; from pathlib import Path; import tempfile; build_app(load_config('config/household.example.yaml'), Path(tempfile.mkdtemp()))"

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real household config must never be committed
        run: |
          if git ls-files --error-unmatch config/household.yaml 2>/dev/null; then
            echo "::error::config/household.yaml is tracked. Remove it and use Secret Manager." && exit 1
          fi

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t homestead:ci .

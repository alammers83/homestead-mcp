name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation; no stored GCP keys

jobs:
  deploy:
    # Only deploy commits that passed CI after a push to main in this repo. The
    # `branches: [main]` filter matches the head branch name of any CI run, so without
    # the event and repository checks a fork PR from the fork's own `main` branch would
    # pass CI and get deployed with this repo's credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.IMAGE_REPO }}/homestead:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: homestead
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
